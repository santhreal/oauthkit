# oauthkit built-in provider registry (Tier-B data).
#
# This is the single, data-driven source of provider breadth. A consuming CLI
# extends it by merging its own TOML (Registry::merge) rather than editing this
# file, and adds provider-specific OAuth (its own registered client_id/redirect)
# the same way.
#
# Each provider lists one or more methods in presentation order. A method is one
# of: flow = "oauth" (authorization-code + PKCE, loopback redirect),
# flow = "device" (RFC 8628 device-code), or flow = "api_key".
#
# The API-key entries below carry each provider's real environment variable,
# console URL, and key prefix, so a CLI can pick keys up non-interactively and
# give the user an accurate "get a key here" link. OAuth/device entries are only
# included where the provider publishes stable public client parameters.

[[provider]]
id = "anthropic"
display_name = "Anthropic"
note = "Claude models"
  [[provider.methods]]
  flow = "api_key"
  env_var = "ANTHROPIC_API_KEY"
  console_url = "https://console.anthropic.com/settings/keys"
  key_prefix = "sk-ant-"
  label = "Paste an Anthropic API key"

